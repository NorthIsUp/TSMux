name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      HAS_IOS_SIGNING: ${{ secrets.DIST_P12_BASE64 != '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # mise installs the toolchain pinned in mise.toml and puts mise-tasks/ on
      # the task list, so every step below is the same recipe a dev runs locally.
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: lint
        run: mise run lint

      - name: test
        run: mise run test

      - name: build
        run: mise run build

      # The menu bar app only builds on macOS; keep it in the same pipeline so a
      # Swift break fails CI rather than surfacing at release time.
      - name: swift build
        if: runner.os == 'macOS'
        run: |
          mise run ssh:lib
          swift test --package-path TSMuxShell
          (cd macos && swift build -c release)

      # The iOS app: shared Swift models, then an unsigned device build of the
      # app and its tunnel extension around the Go core. With signing, the
      # archive in the sign job proves the build instead.
      - name: ios build
        if: runner.os == 'macOS'
        run: |
          swift test --package-path TSMuxKit
          if [ "$HAS_IOS_SIGNING" != true ]; then mise run ios:build; fi

      # Everything the steps above don't cover (swift-format, actionlint, pkl,
      # trailing whitespace). macOS only: swift-format ships with Xcode.
      - name: hk check
        if: runner.os == 'macOS'
        run: mise run hk:check

  # Proves both signing paths on every PR (Developer ID for the Mac app, App
  # Store for iOS) without notarizing or uploading. Each half skips when its
  # secrets are absent, so a fork's PR still passes on the test job alone.
  sign:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      HAS_DEVID: ${{ secrets.DEVID_P12 != '' }}
      HAS_IOS_SIGNING: ${{ secrets.DIST_P12_BASE64 != '' }}
      HAS_MAC_STORE: ${{ secrets.MAC_APP_PROFILE_BASE64 != '' && secrets.DIST_P12_BASE64 != '' }}
    outputs:
      exported: ${{ steps.export.outcome == 'success' }}
      exported_mac: ${{ steps.export_mac.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v2
        if: env.HAS_DEVID == 'true' || env.HAS_IOS_SIGNING == 'true'
        with:
          install: true
          cache: true

      # One keychain holds both identities. Never cached: keychains, profiles
      # and keys are rebuilt from secrets every run.
      - name: Signing
        if: env.HAS_DEVID == 'true' || env.HAS_IOS_SIGNING == 'true'
        env:
          DEVID_P12: ${{ secrets.DEVID_P12 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
          APP_PROFILE_BASE64: ${{ secrets.APP_PROFILE_BASE64 }}
          TUNNEL_PROFILE_BASE64: ${{ secrets.TUNNEL_PROFILE_BASE64 }}
          INSTALLER_P12: ${{ secrets.INSTALLER_P12 }}
          MAC_APP_PROFILE_BASE64: ${{ secrets.MAC_APP_PROFILE_BASE64 }}
          MAC_TUNNEL_PROFILE_BASE64: ${{ secrets.MAC_TUNNEL_PROFILE_BASE64 }}
        run: |
          if [ "$HAS_DEVID" = true ]; then
            printf '%s\n%s\n' "$P12_PASSWORD" "$DEVID_P12" | scripts/ci-keychain.sh
          fi
          if [ "$HAS_IOS_SIGNING" = true ]; then
            printf '%s\n%s\n' "$DIST_P12_PASSWORD" "$DIST_P12_BASE64" | scripts/ci-keychain.sh
            profiles="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
            mkdir -p "$profiles"
            printf '%s' "$APP_PROFILE_BASE64" | base64 -D > "$profiles/tsmux-app.mobileprovision"
            printf '%s' "$TUNNEL_PROFILE_BASE64" | base64 -D > "$profiles/tsmux-tunnel.mobileprovision"
          fi
          if [ "$HAS_MAC_STORE" = true ]; then
            # The installer cert signs the .pkg; it shares the Developer ID p12's password.
            printf '%s\n%s\n' "$P12_PASSWORD" "$INSTALLER_P12" | scripts/ci-keychain.sh
            profiles="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
            mkdir -p "$profiles"
            printf '%s' "$MAC_APP_PROFILE_BASE64" | base64 -D > "$profiles/tsmux-mac-app.provisionprofile"
            printf '%s' "$MAC_TUNNEL_PROFILE_BASE64" | base64 -D > "$profiles/tsmux-mac-tunnel.provisionprofile"
          fi

      - name: Sign the Mac app (not notarized)
        if: env.HAS_DEVID == 'true'
        run: |
          ./scripts/build-app.sh
          ./scripts/devid.sh --sign-only

      - name: Archive and export iOS
        id: export
        if: env.HAS_IOS_SIGNING == 'true'
        # Internal-only builds can never reach the public beta.
        env:
          INTERNAL_ONLY: '0'
        run: scripts/ios-testflight.sh --no-upload

      - uses: actions/upload-artifact@v4
        if: steps.export.outcome == 'success' && github.event_name != 'pull_request'
        with:
          name: ipa
          path: |
            ios/build/testflight/*.ipa
            ios/build/testflight/AppStoreInfo.plist
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      # The same App Store app on the Mac: a menu bar app in place of the window.
      - name: Archive and export macOS (App Store)
        id: export_mac
        if: env.HAS_MAC_STORE == 'true'
        env:
          PLATFORM: macos
          INTERNAL_ONLY: '0'
        run: scripts/ios-testflight.sh --no-upload

      - uses: actions/upload-artifact@v4
        if: steps.export_mac.outcome == 'success' && github.event_name != 'pull_request'
        with:
          name: pkg
          path: |
            ios/build/testflight-macos/*.pkg
            ios/build/testflight-macos/AppStoreInfo.plist
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # Every main push lands in internal TestFlight (iOS, and macOS once its
  # secrets exist); a push that bumps VERSION
  # also goes to Beta App Review for the public link. Both mostly wait on
  # Apple, so they run on Linux, where minutes cost a tenth.
  testflight:
    needs: [test, sign]
    if: needs.sign.outputs.exported == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TRANSPORTER_VERSION: 4.0.0.4
    steps:
      - uses: actions/cache@v4
        id: transporter
        with:
          path: ~/itms
          key: transporter-linux-${{ env.TRANSPORTER_VERSION }}

      # The MD5 is for 4.0.0.4, from
      # https://transporter.amp.apple.com/transporter/asu/<version>/installers/manifest.json
      - name: Install Transporter
        if: steps.transporter.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/tx.sh "https://transporter.amp.apple.com/transporter/asu/$TRANSPORTER_VERSION/installers/iTMSTransporter_installer_linux_x64_$TRANSPORTER_VERSION.sh"
          echo "7f9e49cc429d4e8e78ab14094b2c9161  /tmp/tx.sh" | md5sum -c -
          sh /tmp/tx.sh --accept --noexec --target /tmp/tx
          mv /tmp/tx/itms ~/itms

      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          fetch-depth: 2

      - name: Did this push bump VERSION?
        id: bump
        run: |
          if git diff --quiet HEAD^ HEAD -- VERSION; then
            echo "public=false" >> "$GITHUB_OUTPUT"
          else
            echo "public=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          name: ipa
          path: exports/ios

      - uses: actions/download-artifact@v4
        if: needs.sign.outputs.exported_mac == 'true'
        with:
          name: pkg
          path: exports/macos

      # Relative paths at the default log level fail the .ipa with no reason;
      # absolute paths at eXtreme upload. The full log is kept only on failure.
      - name: Upload to TestFlight
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: 238ATU74S4
          ASC_ISSUER_ID: 98c62465-9650-49ec-afe4-23318e5c1ae1
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          pip install --quiet 'pyjwt[crypto]'
          for export in "$PWD"/exports/*/TSMux.*; do
            if ~/itms/bin/iTMSTransporter -m upload -assetFile "$export" \
                 -assetDescription "$(dirname "$export")/AppStoreInfo.plist" \
                 -apiKey "$ASC_KEY_ID" -apiIssuer "$ASC_ISSUER_ID" -v eXtreme > transporter.log 2>&1; then
              tail -40 transporter.log
              continue
            fi
            grep -v -e 'indexing file' -e 'created symlink' transporter.log | tail -300
            # Transporter self-updates at launch and has failed with "parts failed"
            # after the build had in fact landed; App Store Connect is the truth.
            python3 scripts/asc-build-landed.py "$export"
          done

      - name: Attach the builds to their App Store versions
        env:
          ASC_KEY_ID: 238ATU74S4
          ASC_ISSUER_ID: 98c62465-9650-49ec-afe4-23318e5c1ae1
        run: for e in exports/*/TSMux.*; do python3 scripts/testflight.py attach "$e"; done

      - name: Submit to the public beta
        if: steps.bump.outputs.public == 'true'
        env:
          ASC_KEY_ID: 238ATU74S4
          ASC_ISSUER_ID: 98c62465-9650-49ec-afe4-23318e5c1ae1
        run: for e in exports/*/TSMux.*; do python3 scripts/testflight.py ship "$e"; done

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: transporter-log
          path: transporter.log
          retention-days: 3
