name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      HAS_IOS_SIGNING: ${{ secrets.DIST_P12_BASE64 != '' }}
      HAS_DEVID: ${{ secrets.DEVID_P12 != '' && secrets.DIRECT_APP_PROFILE_BASE64 != '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # mise installs the toolchain pinned in mise.toml and puts mise-tasks/ on
      # the task list, so every step below is the same recipe a dev runs locally.
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: lint
        run: mise run lint

      - name: test
        run: mise run test

      - name: build
        run: mise run build

      # The menu bar app only builds on macOS; keep it in the same pipeline so a
      # Swift break fails CI rather than surfacing at release time. With
      # Developer ID secrets the sign job builds the DMG app instead.
      - name: swift build
        if: runner.os == 'macOS'
        run: |
          mise run ssh:lib
          swift test --package-path TSMuxShell
          swift test --package-path macos
          (cd macos && swift build -c release)
          if [ "$HAS_DEVID" != true ]; then ./scripts/build-app.sh --unsigned; fi

      # The iOS app: shared Swift models, then an unsigned device build of the
      # app and its tunnel extension around the Go core. With signing, the
      # archive in the sign job proves the build instead.
      - name: ios build
        if: runner.os == 'macOS'
        run: |
          swift test --package-path TSMuxKit
          if [ "$HAS_IOS_SIGNING" != true ]; then mise run ios:build; fi

      # Everything the steps above don't cover (swift-format, actionlint, pkl,
      # trailing whitespace). macOS only: swift-format ships with Xcode.
      - name: hk check
        if: runner.os == 'macOS'
        run: mise run hk:check

  # Proves both signing paths on every PR (Developer ID for the Mac app, App
  # Store for iOS) without notarizing or uploading. Each half skips when its
  # secrets are absent, so a fork's PR still passes on the test job alone.
  sign:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      HAS_DEVID: ${{ secrets.DEVID_P12 != '' && secrets.DIRECT_APP_PROFILE_BASE64 != '' }}
      HAS_IOS_SIGNING: ${{ secrets.DIST_P12_BASE64 != '' }}
      HAS_MAC_STORE: ${{ secrets.MAC_APP_PROFILE_BASE64 != '' && secrets.DIST_P12_BASE64 != '' }}
    outputs:
      exported: ${{ steps.export.outcome == 'success' }}
      exported_mac: ${{ steps.export_mac.outcome == 'success' }}
      uploaded_ios: ${{ steps.upload.outputs.ios }}
      uploaded_mac: ${{ steps.upload.outputs.macos }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v2
        if: env.HAS_DEVID == 'true' || env.HAS_IOS_SIGNING == 'true'
        with:
          install: true
          cache: true

      # One keychain holds both identities. Never cached: keychains, profiles
      # and keys are rebuilt from secrets every run.
      - name: Signing
        if: env.HAS_DEVID == 'true' || env.HAS_IOS_SIGNING == 'true'
        env:
          DEVID_P12: ${{ secrets.DEVID_P12 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
          APP_PROFILE_BASE64: ${{ secrets.APP_PROFILE_BASE64 }}
          TUNNEL_PROFILE_BASE64: ${{ secrets.TUNNEL_PROFILE_BASE64 }}
          INSTALLER_P12: ${{ secrets.INSTALLER_P12 }}
          MAC_APP_PROFILE_BASE64: ${{ secrets.MAC_APP_PROFILE_BASE64 }}
          MAC_TUNNEL_PROFILE_BASE64: ${{ secrets.MAC_TUNNEL_PROFILE_BASE64 }}
          DIRECT_APP_PROFILE_BASE64: ${{ secrets.DIRECT_APP_PROFILE_BASE64 }}
          DIRECT_TUNNEL_PROFILE_BASE64: ${{ secrets.DIRECT_TUNNEL_PROFILE_BASE64 }}
        run: |
          if [ "$HAS_DEVID" = true ]; then
            printf '%s\n%s\n' "$P12_PASSWORD" "$DEVID_P12" | scripts/ci-keychain.sh
            profiles="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
            mkdir -p "$profiles"
            printf '%s' "$DIRECT_APP_PROFILE_BASE64" | base64 -D > "$profiles/tsmux-direct-app.provisionprofile"
            printf '%s' "$DIRECT_TUNNEL_PROFILE_BASE64" | base64 -D > "$profiles/tsmux-direct-tunnel.provisionprofile"
          fi
          if [ "$HAS_IOS_SIGNING" = true ]; then
            printf '%s\n%s\n' "$DIST_P12_PASSWORD" "$DIST_P12_BASE64" | scripts/ci-keychain.sh
            profiles="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
            mkdir -p "$profiles"
            printf '%s' "$APP_PROFILE_BASE64" | base64 -D > "$profiles/tsmux-app.mobileprovision"
            printf '%s' "$TUNNEL_PROFILE_BASE64" | base64 -D > "$profiles/tsmux-tunnel.mobileprovision"
          fi
          if [ "$HAS_MAC_STORE" = true ]; then
            # The installer cert signs the .pkg; it shares the Developer ID p12's password.
            printf '%s\n%s\n' "$P12_PASSWORD" "$INSTALLER_P12" | scripts/ci-keychain.sh
            profiles="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
            mkdir -p "$profiles"
            printf '%s' "$MAC_APP_PROFILE_BASE64" | base64 -D > "$profiles/tsmux-mac-app.provisionprofile"
            printf '%s' "$MAC_TUNNEL_PROFILE_BASE64" | base64 -D > "$profiles/tsmux-mac-tunnel.provisionprofile"
          fi

      - name: Sign the Mac app (not notarized)
        if: env.HAS_DEVID == 'true'
        run: |
          ./scripts/build-app.sh
          ./scripts/devid.sh --sign-only

      - name: Archive and export iOS
        id: export
        if: env.HAS_IOS_SIGNING == 'true'
        # Internal-only builds can never reach the public beta.
        env:
          INTERNAL_ONLY: '0'
        run: scripts/ios-testflight.sh --no-upload

      - uses: actions/upload-artifact@v4
        if: steps.export.outcome == 'success' && github.event_name != 'pull_request'
        with:
          name: ipa
          path: |
            ios/build/testflight/*.ipa
            ios/build/testflight/AppStoreInfo.plist
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      # The same App Store app on the Mac: a menu bar app in place of the window.
      - name: Archive and export macOS (App Store)
        id: export_mac
        if: env.HAS_MAC_STORE == 'true'
        env:
          PLATFORM: macos
          INTERNAL_ONLY: '0'
        run: scripts/ios-testflight.sh --no-upload

      # Linux Transporter fails both exports at random before sending a byte and
      # never says why; altool reads the export itself and names its errors. One
      # platform failing must not hold back the other, so the testflight job
      # reports each outcome instead of this step failing.
      - name: Upload to TestFlight
        id: upload
        if: (steps.export.outcome == 'success' || steps.export_mac.outcome == 'success') && github.event_name != 'pull_request'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: 238ATU74S4
          ASC_ISSUER_ID: 98c62465-9650-49ec-afe4-23318e5c1ae1
          IOS: ${{ steps.export.outcome }}
          MACOS: ${{ steps.export_mac.outcome }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          upload() {
            for attempt in 1 2; do
              xcrun altool --upload-app -t "$1" -f "$2" \
                --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" && return 0
              [ "$attempt" = 2 ] || sleep 30
            done
            return 1
          }
          if [ "$IOS" = success ]; then
            upload ios ios/build/testflight/TSMux.ipa && r=success || r=failure
            echo "ios=$r" >> "$GITHUB_OUTPUT"
          fi
          if [ "$MACOS" = success ]; then
            upload macos ios/build/testflight-macos/TSMux.pkg && r=success || r=failure
            echo "macos=$r" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        if: steps.export_mac.outcome == 'success' && github.event_name != 'pull_request'
        with:
          name: pkg
          path: |
            ios/build/testflight-macos/*.pkg
            ios/build/testflight-macos/AppStoreInfo.plist
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # Every main push lands in internal TestFlight, iOS and macOS; a push that
  # bumps VERSION also goes to Beta App Review for the public link. Waiting on
  # Apple's processing runs on Linux, where minutes cost a tenth.
  testflight:
    needs: [test, sign]
    if: (needs.sign.outputs.exported == 'true' || needs.sign.outputs.exported_mac == 'true') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Two runs uploading at once lost one of the .ipas. Queued, not cancelled,
    # though GitHub keeps only the newest pending run, so a third push while one
    # waits here drops the middle push's builds.
    concurrency:
      group: testflight
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          fetch-depth: 2

      - name: Did this push bump VERSION?
        id: bump
        run: |
          if git diff --quiet HEAD^ HEAD -- VERSION; then
            echo "public=false" >> "$GITHUB_OUTPUT"
          else
            echo "public=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: needs.sign.outputs.exported == 'true'
        with:
          name: ipa
          path: exports/ios

      - uses: actions/download-artifact@v4
        if: needs.sign.outputs.exported_mac == 'true'
        with:
          name: pkg
          path: exports/macos

      # Each export goes on to attach and ship on its own, so one failing
      # doesn't strand the other; the step fails at the end if any did.
      - name: Attach and ship each build
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: 238ATU74S4
          ASC_ISSUER_ID: 98c62465-9650-49ec-afe4-23318e5c1ae1
          PUBLIC: ${{ steps.bump.outputs.public }}
          IOS_UPLOAD: ${{ needs.sign.outputs.uploaded_ios }}
          MAC_UPLOAD: ${{ needs.sign.outputs.uploaded_mac }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          pip install --quiet 'pyjwt[crypto]'
          uploaded() {
            case $1 in
              *.ipa) [ "$IOS_UPLOAD" = success ] ;;
              *.pkg) [ "$MAC_UPLOAD" = success ] ;;
            esac || { echo "the sign job's upload of $(basename "$1") failed"; return 1; }
          }
          failed=
          for export in "$PWD"/exports/*/TSMux.*; do
            echo "::group::$export"
            if ! (uploaded "$export" && python3 scripts/testflight.py attach "$export" &&
                  { [ "$PUBLIC" != true ] || python3 scripts/testflight.py ship "$export"; }); then
              echo "::error::$(basename "$export") did not make it to TestFlight"
              failed=1
            fi
            echo "::endgroup::"
          done
          [ -z "$failed" ]
