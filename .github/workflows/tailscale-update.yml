name: tailscale-update

# tsmux is a thin shell around tsnet, so the dependency is most of what ships:
# a Tailscale release is more likely to matter to a user than a change of ours.
# Daily, apply it, and only commit if it still builds and passes.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: tailscale-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      # @latest resolves to the newest *release*, so a -pre never lands here.
      - id: bump
        name: Update tailscale.com
        run: |
          before=$(go list -m -f '{{.Version}}' tailscale.com)
          go get tailscale.com@latest
          after=$(go list -m -f '{{.Version}}' tailscale.com)
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "after=$after" >> "$GITHUB_OUTPUT"
          if [ "$before" = "$after" ]; then
            echo "already on $after"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$before -> $after"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The gate. An update that does not build is not committed, so main is
      # never left broken by an unattended job.
      - name: Build and test
        if: steps.bump.outputs.changed == 'true'
        run: |
          go mod tidy
          go build ./...
          go vet ./...
          go test ./...

      # A PR rather than a push to main: this job runs `go build/vet/test`, but
      # ci.yml also runs `swift build -c release`, the linters and hk. A
      # Tailscale bump that broke the *Swift* build would sail past this job's
      # gate and land on main. The PR makes the real CI the gate and automerge
      # keeps it unattended.
      #
      # PR_TOKEN, not GITHUB_TOKEN: a PR opened with GITHUB_TOKEN does not
      # trigger `on: pull_request` workflows, so ci.yml would never run and
      # automerge would wait forever on checks that cannot start.
      - name: Open a pull request
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PR_TOKEN }}
          BEFORE: ${{ steps.bump.outputs.before }}
          AFTER: ${{ steps.bump.outputs.after }}
        run: |
          test -n "$GH_TOKEN" || {
            echo "PR_TOKEN is not set — see scripts/set-ci-secrets.sh" >&2
            exit 1
          }
          branch="tailscale-update/$AFTER"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add go.mod go.sum
          git commit -m "Update tailscale.com to $AFTER" -m \
            "$BEFORE -> $AFTER, applied by the daily tailscale-update job.

          The version the binary links against is what \`tsmux version\` reports
          as \"<app> (ts <version>)\", so this changes what users see without the
          app's own version moving."
          git push -u origin "$branch"
          gh pr create --fill --base main --head "$branch"
          gh pr merge --auto --squash "$branch"
