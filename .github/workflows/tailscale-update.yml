name: tailscale-update

# tsmux is a thin shell around tsnet, so the dependency is most of what ships:
# a Tailscale release is more likely to matter to a user than a change of ours.
# Daily, apply it, and only commit if it still builds and passes.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tailscale-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      # @latest resolves to the newest *release*, so a -pre never lands here.
      - id: bump
        name: Update tailscale.com
        run: |
          before=$(go list -m -f '{{.Version}}' tailscale.com)
          go get tailscale.com@latest
          after=$(go list -m -f '{{.Version}}' tailscale.com)
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "after=$after" >> "$GITHUB_OUTPUT"
          if [ "$before" = "$after" ]; then
            echo "already on $after"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$before -> $after"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The gate. An update that does not build is not committed, so main is
      # never left broken by an unattended job.
      - name: Build and test
        if: steps.bump.outputs.changed == 'true'
        run: |
          go mod tidy
          go build ./...
          go vet ./...
          go test ./...

      - name: Commit
        if: steps.bump.outputs.changed == 'true'
        env:
          BEFORE: ${{ steps.bump.outputs.before }}
          AFTER: ${{ steps.bump.outputs.after }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          git commit -m "Update tailscale.com to $AFTER" -m \
            "$BEFORE -> $AFTER, applied by the daily tailscale-update job after
          go build, go vet and go test passed.

          The version the binary is linked against is what \`tsmux version\`
          reports as \"<app> (ts <version>)\", so this commit changes what users
          see without the app's own version moving."
          git push
