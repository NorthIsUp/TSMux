name: release

# Releases are cut by pushing a tag: `mise run release` tags v<VERSION> from
# the VERSION file and pushes it. The tag is what this workflow releases, so
# an ordinary commit to main never publishes anything.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  # A dry run: builds, signs and notarizes exactly as a release does, then stops
  # without publishing. Without it the first exercise of the signing path would
  # be a public release, which is a poor place to discover a missing secret.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - id: v
        name: Version from tag
        env:
          TAG: ${{ github.ref_name }}
          DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          # A dry run has no tag to read, so it takes VERSION at face value and
          # skips the agreement check below that the tag exists to make.
          if [ "$DISPATCH" = true ]; then
            version=$(tr -d '[:space:]' < VERSION)
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "dry run of $version (not publishing)"
            exit 0
          fi
          version=${TAG#v}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The tag is authoritative, but a VERSION that disagrees means the
          # built binaries would report a different version than the release
          # they ship in. Fail loudly rather than publish that.
          file=$(tr -d '[:space:]' < VERSION)
          if [ "$file" != "$version" ]; then
            echo "tag $TAG disagrees with VERSION ($file)" >&2
            exit 1
          fi
          echo "releasing $TAG"

  binaries:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      # Pure-Go (CGO off), so every target cross-compiles from one runner.
      - name: Cross-compile
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            goos=${target%/*}
            goarch=${target#*/}
            echo "==> $goos/$goarch"
            GOOS=$goos GOARCH=$goarch CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o "dist/tsmux-$goos-$goarch" .
          done
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/tsmux-*
          if-no-files-found: error

  app:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      # Developer ID needs no provisioning profile and no registered bundle id,
      # so this is one certificate and one API key — see scripts/ci-signing.sh.
      - name: Install signing material
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          DEVID_P12: ${{ secrets.DEVID_P12 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: ./scripts/ci-signing.sh

      - name: Build TSMux.app
        run: ./scripts/build-app.sh

      # Signs, notarizes, staples, and builds a notarized dmg. No fallback to an
      # unsigned artifact: a release that quietly shipped un-notarized would put
      # the Gatekeeper warning back in front of every user.
      - name: Sign and notarize
        run: ./scripts/devid.sh

      - name: Collect artifacts
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          mkdir -p dist
          cp "bin/TSMux-$VERSION-macos.zip" "bin/TSMux-$VERSION.dmg" dist/
          # A second copy under a fixed name, so
          # releases/latest/download/TSMux.dmg is a link that never goes stale.
          # The versioned name stays for anyone pinning a release.
          cp "bin/TSMux-$VERSION.dmg" dist/TSMux.dmg
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: |
            dist/TSMux-*-macos.zip
            dist/TSMux-*.dmg
            dist/TSMux.dmg
          if-no-files-found: error

  release:
    needs: [check, binaries, app]
    # A dry run proves the artifacts build and notarize; only a tag publishes.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum tsmux-* TSMux-*-macos.zip TSMux-*.dmg TSMux.dmg > checksums-sha256.txt
          cat checksums-sha256.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Install

            Download the `tsmux` binary for your platform, verify it against
            `checksums-sha256.txt`, then `chmod +x` it and put it on your `PATH`.

            ## macOS menu bar app

            Download `TSMux-${{ needs.check.outputs.version }}.dmg`, open it and drag
            TSMux to Applications. It is signed with a Developer ID certificate and
            notarized by Apple, so it opens normally — no right-click-Open, no
            clearing a quarantine flag.
          files: |
            dist/tsmux-*
            dist/TSMux-*-macos.zip
            dist/TSMux-*.dmg
            dist/TSMux.dmg
            dist/checksums-sha256.txt
          fail_on_unmatched_files: true
