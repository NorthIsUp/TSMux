# Generated with `mise run ios:gen`; the .xcodeproj is never committed.
name: TSMux
options:
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    DEVELOPMENT_TEAM: 4BJBDQVY6M
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: "1"
packages:
  TSMuxKit:
    path: ../TSMuxKit
  TSMuxShell:
    path: ../TSMuxShell
schemes:
  TSMux:
    build:
      targets:
        TSMux: all
    test:
      targets:
        - package: TSMuxKit/TSMuxKitTests
targets:
  TSMux:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: TSMuxKit
      - package: TSMuxShell
      - target: TSMuxTunnel
    entitlements:
      path: App/TSMux.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [group.dev.northisup.tsmux]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.northisup.tsmux
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: TSMux
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        # WireGuard is standard crypto and builds go to internal TestFlight only; without
        # this every build waits on the compliance question. Revisit before a public release.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
      # A sibling of base: automatic Release signing fails headless.
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: TSMux App Store
  TSMuxTunnel:
    type: app-extension
    platform: iOS
    sources: [Tunnel]
    dependencies:
      - package: TSMuxKit
      - framework: Frameworks/TSMuxCore.xcframework
        embed: false
    entitlements:
      path: Tunnel/TSMuxTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [group.dev.northisup.tsmux]
    info:
      path: Tunnel/Info.plist
      properties:
        CFBundleDisplayName: TSMux Tunnel
        # An extension whose build number differs from its app's draws ITMS-90473.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.northisup.tsmux.tunnel
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: TSMux Tunnel App Store
